[tox]
envlist =
    py{39,310,311,312}
    format
    lint
    type
    security
    docs
    coverage
isolated_build = true

[gh-actions]
python =
    3.9: py39
    3.10: py310
    3.11: py311
    3.12: py312

[testenv]
deps =
    pytest>=7.0.0
    pytest-cov>=4.0.0
    pytest-mock>=3.10.0
    pytest-benchmark>=4.0.0
    jellyfish>=0.9.0
commands =
    pytest {posargs}

[testenv:format]
deps =
    black>=23.0.0
    isort>=5.12.0
commands =
    black --check --diff src tests
    isort --check-only --diff src tests

[testenv:format-fix]
deps =
    black>=23.0.0
    isort>=5.12.0
commands =
    black src tests
    isort src tests

[testenv:lint]
deps =
    flake8>=6.0.0
    flake8-docstrings>=1.7.0
    flake8-bugbear>=23.0.0
    flake8-comprehensions>=3.10.0
commands =
    flake8 src tests

[testenv:type]
deps =
    mypy>=1.0.0
    types-requests
    pandas-stubs
commands =
    mypy src

[testenv:security]
deps =
    bandit>=1.7.0
    safety>=2.0.0
commands =
    bandit -r src
    safety check

[testenv:docs]
deps =
    sphinx>=6.0.0
    sphinx-rtd-theme>=1.2.0
    myst-parser>=1.0.0
commands =
    sphinx-build -W -b html docs docs/_build/html

[testenv:coverage]
deps =
    pytest>=7.0.0
    pytest-cov>=4.0.0
    coverage>=7.0.0
commands =
    pytest --cov=dedupeflow --cov-report=html --cov-report=xml --cov-report=term-missing
    coverage report --show-missing --fail-under=80

[testenv:benchmark]
deps =
    pytest>=7.0.0
    pytest-benchmark>=4.0.0
commands =
    pytest -m benchmark --benchmark-only

[testenv:clean]
deps = coverage
skip_install = true
commands =
    coverage erase
    python -c "import shutil; shutil.rmtree('.tox', ignore_errors=True)"
    python -c "import shutil; shutil.rmtree('htmlcov', ignore_errors=True)"
    python -c "import shutil; shutil.rmtree('.pytest_cache', ignore_errors=True)"
