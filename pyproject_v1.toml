[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dedupeflow"
dynamic = ["version"]
description = "A modern Python library for data deduplication and record linkage"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "M'Hand KEDJAR", email = "kedjar@gmail.com"}
]
maintainers = [
    {name = "M'Hand KEDJAR", email = "kedjar@gmail.com"}
]
keywords = ["deduplication", "record-linkage", "data-cleaning", "fuzzy-matching"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
phonetic = [
    "jellyfish>=0.9.0",
    "python-Levenshtein>=0.12.0",
]
ml = [
    "scikit-learn>=1.0.0",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
    "pytest-benchmark>=4.0",
]
dev = [
    "dedupeflow[test,phonetic,ml]",
    "black>=23.0",
    "isort>=5.12",
    "flake8>=6.0",
    "flake8-bugbear>=23.0",
    "mypy>=1.0",
    "pre-commit>=3.0",
    "tox>=4.0",
    "hatchling",  # Add hatchling to dev dependencies
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=1.3",
    "sphinx-autodoc-typehints>=1.24",
    "myst-parser>=2.0",
]

[project.urls]
"Homepage" = "https://github.com/kedjar/dedupeflow"
"Documentation" = "https://dedupeflow.readthedocs.io"
"Repository" = "https://github.com/kedjar/dedupeflow"
"Bug Tracker" = "https://github.com/kedjar/dedupeflow/issues"
"Changelog" = "https://github.com/kedjar/dedupeflow/blob/main/CHANGELOG.md"

[project.scripts]
dedupeflow = "dedupeflow.cli:app"

# Setuptools-specific configuration (if using setuptools)
[tool.setuptools.dynamic]
version = {attr = "dedupeflow.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dedupeflow = ["py.typed"]

# Rest of your tool configurations remain the same...
[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88
skip_gitignore = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=dedupeflow",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--strict-markers",
    "--strict-config",
    "--disable-warnings",
    "-v",
]
xfail_strict = true
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "benchmark: Performance benchmark tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning"
]

[tool.coverage.run]
source = ["dedupeflow"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_context = true
show_column_numbers = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "jellyfish.*",
    "Levenshtein.*",
    "sklearn.*",
]
ignore_missing_imports = true
