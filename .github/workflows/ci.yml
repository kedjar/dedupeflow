name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # Code Quality Checks
  format:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install tox
        run: python -m pip install tox

      - name: Run black
        run: tox -e format

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install tox
        run: python -m pip install tox

      - name: Run flake8
        run: tox -e lint

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install tox
        run: python -m pip install tox

      - name: Run mypy
        run: tox -e type

  security:
    name: Security check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install tox
        run: python -m pip install tox

      - name: Run security checks
        run: tox -e security

  # Testing
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tox
        run: python -m pip install tox

      - name: Run pytest
        run: tox -e py${{ matrix.python-version }}

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install tox
        run: python -m pip install tox

      - name: Run coverage
        run: tox -e coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: true

  # Build Artifacts
  build_source_dist:
    name: Build source distribution
    runs-on: ubuntu-latest
    needs: [format, lint, typecheck, security, test, coverage]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for proper versioning

      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install build
        run: python -m pip install build

      - name: Build source distribution
        run: python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: source-dist
          path: dist/*.tar.gz

  build_wheel:
    name: Build universal wheel
    runs-on: ubuntu-latest
    needs: [format, lint, typecheck, security, test, coverage]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for proper versioning

      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install build
        run: python -m pip install build

      - name: Build wheel
        run: python -m build --wheel

      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  # Publishing (only on tags)
  publish:
    name: Publish package
    if: startsWith(github.event.ref, 'refs/tags/v')
    needs: [build_source_dist, build_wheel]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifact structure
        run: |
          mkdir -p final-dist
          find dist -name "*.tar.gz" -o -name "*.whl" | xargs -I {} cp {} final-dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.5.0
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: final-dist/
